[package]
name = "oxiphylo"
version = "0.1.0"
edition = "2021"

[lib]
# "rlib" (alongside "cdylib") lets benches/ and tests/ link this crate
# normally as a Rust library; "cdylib" alone is only linkable by Python.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "oxiphylo_bench"
harness = false
