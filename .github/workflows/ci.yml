name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  rust-tests:
    name: Rust tests (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: Python/Rust build (maturin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install .
      - name: Smoke-test phylo.oxiphylo is importable
        run: python -c "from phylo.oxiphylo import double; assert double(21) == 42"

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install .
      - run: pip install -r requirements-dev.txt
      - run: pytest
