name: Ticket approve

# `/approve` on a ticket: check a plan was actually posted, record the
# approval as a label, and either start the work or hand it to the queue,
# depending on the ticket's priority.
on:
  issue_comment:
    types: [created]

# The cap for the reusable workflow called below, which cannot be granted more
# than its caller holds. The gate job narrows this to what it needs.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check the plan and the priority
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/approve') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    outputs:
      start: ${{ steps.window.outputs.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # infra/CLAUDE.md: an approved pull request implements a plan already
      # posted to the thread. That is checked here rather than trusted, so
      # `/approve` on a ticket nobody planned starts nothing.
      - name: Require a posted plan
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100,
            });
            const plans = comments.filter(c => c.body.trimStart().startsWith('<!-- phylo-plan -->'));
            if (plans.length === 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: number,
                body: 'No plan has been posted on this ticket, so there is nothing to '
                    + 'approve. Comment `/plan` first.',
              });
              core.setFailed('No plan comment on this ticket.');
              return;
            }
            core.setOutput('url', plans[plans.length - 1].html_url);
            core.setOutput('revisions', plans.length);

      - name: Record the approval
        id: labels
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: number, labels: ['approved'],
            });
            // agent:blocked records a previous failure; approving again clears it.
            try {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: number, name: 'agent:blocked',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const issue = await github.rest.issues.get({ ...context.repo, issue_number: number });
            core.setOutput('names', issue.data.labels.map(l => l.name).join(','));

      # priority:high starts here; anything else waits for Ticket queue. The
      # decision lives in infra/schedule.py so it can be tested -- the
      # daylight-saving edge in the Princeton window is not something to
      # discover from a workflow log.
      - name: Decide now or queue
        id: window
        run: |
          start=$(python -m infra.schedule decide --labels "${LABELS}")
          reason=$(python -m infra.schedule decide --labels "${LABELS}" --explain)
          echo "start=$([ "$start" = run ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<EOF"
            echo "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          LABELS: ${{ steps.labels.outputs.names }}

      - name: Say what happens next
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.window.outputs.reason }}
          PLAN_URL: ${{ steps.plan.outputs.url }}
          REVISIONS: ${{ steps.plan.outputs.revisions }}
          STARTING: ${{ steps.window.outputs.start }}
        with:
          script: |
            const revisions = Number(process.env.REVISIONS);
            const which = revisions > 1 ? `revision ${revisions} of the plan` : 'the plan';
            const when = process.env.STARTING === 'true'
              ? 'Starting now.'
              : 'Queued; the next sweep of the ticket queue will pick it up.';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.payload.issue.number,
              body: `Approved: [${which}](${process.env.PLAN_URL}).\n\n`
                  + `${process.env.REASON} ${when}`,
            });

  implement:
    needs: gate
    if: needs.gate.outputs.start == 'true'
    uses: ./.github/workflows/ticket-run.yml
    with:
      # format() rather than the bare number: the reusable workflow declares a
      # string input, because workflow_dispatch has no number type.
      issue: ${{ format('{0}', github.event.issue.number) }}
    secrets: inherit
