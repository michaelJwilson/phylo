[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "phylo"
# Single source of truth for the version is Cargo.toml's [package].version;
# maturin reads it from there when `dynamic = ["version"]` is set, so the
# two files can't silently drift out of sync.
dynamic = ["version"]
description = ""
authors = [{ name = "M. J. Wilson" }]
license = "MIT"
requires-python = ">=3.12.2"
readme = "README.md"
# Intentionally empty: nothing under python/phylo/ imports an external package
# yet. Add entries as real code depends on them, rather than front-loading an
# intended stack (see CLAUDE.md, "keep dependencies minimal").
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.9.9,<0.10",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "pip-audit>=2.7",
]
docs = [
    "sphinx>=7,<9",
]
test = [
    # >=9.0.3 is the fix for PYSEC-2026-1845; the previous <9 cap blocked it.
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-benchmark>=4",
    "numpy>=1.26.0",
]

[project.scripts]
run_phylo = "phylo.scripts.run_phylo:main"

[tool.maturin]
python-source = "python"
module-name = "phylo.oxiphylo"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "G004", # f-string in logger
  "T201", # print statements
  "PLR2004", # magic value in assert
  "ANN",  # annotation presence is enforced by mypy --strict, not ruff
]
# NPY002 (legacy np.random calls) is deliberately NOT ignored: seeded
# `np.random.default_rng` is the reproducibility convention here.

extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "NPY",         # NumPy specific rules
  "PD",          # pandas-vet
]
extend-ignore = [
  "PLR09",    # Too many <...>
  "ISC001",   # Conflicts with formatter
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]

[tool.ruff.lint.per-file-ignores]
# Tests are linted like the rest of the repo -- scientific correctness lives
# here. Only rules that fight normal pytest style are relaxed.
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # literal expected values are the point of a regression test
]

[tool.mypy]
strict = true
files = ["python", "tests"]

[[tool.mypy.overrides]]
# pytest-benchmark ships no py.typed marker.
module = "pytest_benchmark.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["phylo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
