repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy and the Rust checks run against the tools already installed via
  # `pip install ".[dev]"` / rustup, rather than pre-commit-managed envs,
  # to avoid a second, separately-versioned copy of each toolchain.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        pass_filenames: false

  # Dependency audits. Both reach the network, so they add a few seconds per
  # commit. cargo-audit is not part of the Rust toolchain: install it once with
  # `cargo install cargo-audit --locked`.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: pip-audit
        language: system
        pass_filenames: false
      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
